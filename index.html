<style>
/* Cleary University palette (Brand Standards guide) */
:root{
  --navy:#002B5C; --dkblue:#152553; --blue:#1B5485; --red:#B30838; --dkred:#8B0027; --gray:#D1D3D4; --dkgray:#A7A9AC;
  --bg:#07122A; --card:#0F1E40; --card2:#142852; --line:#22386A; --text:#EEF2F8; --mute:#9DB0CC; --dim:#6A7FA3;
  --done:#2FB873; --donebg:rgba(47,184,115,.14); --accent:#E8274F;
  --head:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Barlow,system-ui,sans-serif,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 12px}

/* header */
header{background:#04102A;border-bottom:1px solid var(--line);color:#fff;padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,20,50,.25)}
.brand{display:flex;align-items:center;gap:10px;padding:8px 0 8px}
.logos{display:flex;gap:6px;align-items:center;flex:none}
.logo{height:36px;min-width:36px;display:grid;place-items:center}
.logo img{height:36px;width:auto;display:block}
.logo.ph{background:var(--red);font:700 17px var(--head);letter-spacing:.5px}
.titles{flex:1;min-width:0}
.titles .k{font:600 11px Barlow,system-ui,sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:#A9C1DE}
.titles h1{margin:1px 0 0;font:600 19px/1.1 var(--head);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stripe{height:4px;background:var(--red)}
.rowsel{display:flex;gap:6px;padding:0 0 10px;overflow-x:auto;scrollbar-width:none}
.rowsel::-webkit-scrollbar{display:none}
.rowsel{padding:0 0 8px}.rowsel button{flex:1 0 auto;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#DCE6F2;border-radius:9px;padding:6px 8px;font:500 12px Barlow,system-ui,sans-serif;line-height:1.1;min-width:60px;display:flex;align-items:baseline;justify-content:center;gap:5px;white-space:nowrap}
.rowsel button b{font:600 15px var(--head);color:#fff;letter-spacing:.3px;text-transform:uppercase}
.rowsel button.on{background:var(--red);color:#fff;border-color:var(--red)}
.rowsel button.on b{color:#fff}
.rowsel button .ok{color:#7FE0A8}
.rowsel button.on .ok{color:#fff}

/* day */
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;margin:16px 2px 8px}
.dayhead h2{margin:0;font:700 28px/1 var(--head);text-transform:uppercase;color:#fff}
.dayhead .meta{font-size:12.5px;color:var(--mute);text-align:right}
.bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;margin:0 2px 12px}
.bar i{display:block;height:100%;background:var(--done);transition:width .3s}
.callout{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--mute);margin:10px 0}
.callout b{color:var(--text)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.chead{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--navy);color:#fff;border-bottom:2px solid var(--red)}
.letter{width:28px;height:28px;border-radius:7px;background:var(--red);display:grid;place-items:center;font:700 17px var(--head);flex:none}
.chead .t{flex:1;font:600 16px var(--head);text-transform:uppercase;letter-spacing:.5px}
.chead .t small{display:block;font:500 11.5px Barlow,system-ui,sans-serif;text-transform:none;letter-spacing:0;color:#B8CBE2}
.restbtn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:5px 9px;font:600 12px Barlow,system-ui,sans-serif;white-space:nowrap}
.rst{border:1px solid rgba(255,255,255,.25);background:transparent;color:#C9D6EA;border-radius:8px;padding:5px 8px;font:600 12px Barlow,system-ui,sans-serif;white-space:nowrap}
.rst.arm{background:#fff;color:var(--red);border-color:#fff}
.resetday{display:block;margin:18px auto 0;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:10px;padding:9px 14px;font:600 13px Barlow,system-ui,sans-serif}
.resetday.arm{background:var(--red);border-color:var(--red);color:#fff}
.steps{margin:0;padding:10px 14px 10px 32px;background:var(--card2);border-bottom:1px solid var(--line);font-size:13.5px;color:#C9D6EA}
.steps li{margin:3px 0;padding-left:2px}
.steps li b{color:#fff}
.plan{margin:5px 0 0 32px;font:600 15px var(--head);color:#8FB8E6;letter-spacing:.2px}
.plan span{font:500 12.5px Barlow,system-ui,sans-serif;color:var(--mute)}
.plan .timedtag{font:700 11px Barlow,system-ui,sans-serif;color:#0B1A33;background:#F3C34A;border-radius:5px;padding:2px 6px;margin-left:4px;letter-spacing:.5px}
.hint{font-size:12px;color:var(--mute);margin:8px 0 0 32px}
.wsub{display:block;font-size:11.5px;color:#FF6F8A;font-weight:600}
.play{height:38px;border:0;border-radius:8px;background:#F3C34A;color:#0B1A33;font:700 13px Barlow,system-ui,sans-serif;padding:0 10px;white-space:nowrap}
.tlab small{display:block;font:600 11px Barlow,system-ui,sans-serif;text-transform:uppercase;letter-spacing:1px;opacity:.85}
.keybtn{flex:none;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;border-radius:9px;padding:8px 12px;font:600 13px Barlow,system-ui,sans-serif}
#keyov{position:fixed;inset:0;z-index:100;background:rgba(2,8,20,.7);display:flex;align-items:flex-end;justify-content:center}
#keyov[hidden]{display:none}
#keyov .sheet{background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:85vh;display:flex;flex-direction:column}
#keyov .sh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:2px solid var(--red)}
#keyov .sh b{font:600 19px var(--head);text-transform:uppercase;letter-spacing:.5px}
#keyov .sh button{border:0;background:var(--red);color:#fff;border-radius:8px;padding:8px 14px;font:600 13px Barlow,system-ui,sans-serif}
#keyov .sb{overflow-y:auto;padding:4px 16px calc(20px + env(safe-area-inset-bottom))}
.kg{font:600 13px var(--head);text-transform:uppercase;letter-spacing:.8px;color:#FF6F8A;margin:16px 0 6px}
.kdl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:0}
.kdl dt{font-weight:700;color:#fff;white-space:nowrap}
.kdl dd{margin:0;color:var(--mute)}
.keylink{border:0;background:none;color:#8FB8E6;font:600 inherit;text-decoration:underline;padding:0;cursor:pointer}
.abbr{display:flex;flex-wrap:wrap;gap:4px 10px;margin:4px 0 0 32px;font-size:11.5px;color:var(--mute)}
.abbr b{color:#C9D6EA;font-weight:700}
.abbr.wu{margin:2px 0 0}
#wm{position:fixed;left:50%;top:58%;width:min(88vw,520px);aspect-ratio:420/304;transform:translate(-50%,-50%);background:center/contain no-repeat;opacity:.06;pointer-events:none;z-index:0;filter:saturate(.6)}
main{position:relative;z-index:1}
.dayhead{align-items:center}
.dayhead .badge{height:64px;width:auto;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.dayhead .lt{flex:1}
.dayhead .lt .meta{text-align:left;margin-top:4px}
.donebanner{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,rgba(179,8,56,.25),rgba(0,43,92,.3));border:1px solid rgba(179,8,56,.5);border-radius:12px;padding:10px 12px;margin:10px 0;font:600 15px var(--head);text-transform:uppercase;letter-spacing:.5px}
.donebanner img{height:30px}
.footlogo{display:block;height:34px;margin:0 auto 8px;opacity:.8}
.sumhead{display:flex;align-items:center;gap:12px;margin:14px 2px 0}
.sumhead img{height:58px}
.sumhead h2{margin:0;font:700 26px/1 var(--head);text-transform:uppercase}
.sumhead small{display:block;color:var(--mute);font:500 12.5px Barlow,system-ui,sans-serif;text-transform:none;margin-top:3px}
#keyov .sh img{height:22px;margin-right:8px;vertical-align:middle}
.mrow{display:flex;gap:6px;overflow-x:auto;margin:12px 0 0;padding-bottom:2px;scrollbar-width:none}
.mrow::-webkit-scrollbar{display:none}
.mrow button{flex:none;min-width:54px;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:10px;padding:6px 8px;font:600 15px var(--head);text-transform:uppercase;line-height:1.05}
.mrow button small{display:block;font:500 10.5px Barlow,system-ui,sans-serif;opacity:.8}
.mrow button.on{background:var(--red);border-color:var(--red);color:#fff}
.formula{font:600 12.5px Barlow,system-ui,sans-serif;color:#8FB8E6!important;background:var(--card2);border-radius:8px;padding:7px 10px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tgrid.two{grid-template-columns:1fr 1fr;margin-top:10px}
.tgrid label{font:600 11.5px Barlow,system-ui,sans-serif;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.tgrid input{height:40px;border:1px solid #2E4880;border-radius:8px;background:#07122A;color:var(--text);font:700 16px Barlow,system-ui,sans-serif;text-align:center;width:100%}
.tgrid input:focus,.nrow input:focus{outline:none;border-color:#4C8DD6}
.tgrid small{font:500 11px Barlow,system-ui,sans-serif;color:var(--dim)}
.tcal{margin:10px 0 0;background:var(--card2);border-radius:9px;padding:9px 12px;font-size:13.5px;color:var(--mute)}
.tcal b{font:700 20px var(--head);color:#fff;margin:0 4px}
.tcal span{font-size:11px;background:rgba(47,184,115,.18);color:var(--done);border-radius:5px;padding:2px 6px}
.nhead,.nrow{display:grid;grid-template-columns:52px repeat(4,1fr) 46px;gap:4px;align-items:center;padding:0 10px}
.nhead{padding-top:8px;padding-bottom:6px;font:600 10.5px Barlow,system-ui,sans-serif;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}
.nhead span:not(:first-child){text-align:center}
.nrow{padding-top:4px;padding-bottom:4px;border-bottom:1px solid rgba(34,56,106,.5)}
.nrow input{height:34px;width:100%;min-width:0;border:1px solid #2A4174;border-radius:7px;background:#07122A;color:var(--text);font:600 14px Barlow,system-ui,sans-serif;text-align:center;padding:0 2px}
.nrow .nd{font:600 13px var(--head);color:var(--mute);white-space:nowrap}
.nrow .nd i{font-style:normal;font-size:10px;margin-left:1px}
.nrow.wi{background:rgba(243,195,74,.06)}
.nrow input.wiin{border-color:rgba(243,195,74,.6)}
.nrow input.wiin::placeholder{color:rgba(243,195,74,.55);font-size:11px}
.nrow.today{background:rgba(179,8,56,.16)}
.nrow.today .nd{color:#fff}
.ncal{font:600 14px var(--head);text-align:right;color:#8FB8E6}
.ntot{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-size:12.5px;color:var(--mute)}
.ntot b{font:700 17px var(--head);color:#fff}
.srowx{margin:6px 0 10px}
.sl2{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.sl2 b{color:#fff;font:700 16px var(--head)}
.mbar{height:6px;background:var(--card2);border-radius:5px;overflow:hidden;margin-top:4px}
.mbar i{display:block;height:100%;background:var(--done)}
.wline{font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:9px;margin-top:4px}
.wline b{color:#fff}
.jump{display:flex;justify-content:space-between;align-items:center;width:100%;margin:12px 0 0;border:1px solid rgba(232,39,79,.5);background:linear-gradient(90deg,rgba(179,8,56,.28),rgba(0,43,92,.35));color:#fff;border-radius:12px;padding:12px 14px;font:600 15px var(--head);text-transform:uppercase;letter-spacing:.5px;text-align:left}
.jump span{font:600 12px Barlow,system-ui,sans-serif;text-transform:none;letter-spacing:0;color:#C9D6EA;margin-left:auto;margin-right:8px}
.nsumcard{border-color:rgba(232,39,79,.5);box-shadow:0 0 0 1px rgba(232,39,79,.15)}
.bigcal{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.bigcal span{color:var(--mute);font-size:13px}
.bigcal b{font:700 34px/1 var(--head);color:#fff}
.mtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mtiles div{background:var(--card2);border-radius:10px;padding:9px;text-align:center}
.mtiles span{display:block;font:600 11px Barlow,system-ui,sans-serif;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.mtiles b{font:700 22px var(--head);color:#fff}
.mtiles b small{font:500 12px Barlow,system-ui,sans-serif;color:var(--mute);margin-left:1px}
.mtiles em{display:block;font:600 11.5px Barlow,system-ui,sans-serif;font-style:normal;color:#8FB8E6}
.split{display:flex;height:9px;border-radius:6px;overflow:hidden;margin-top:12px}
.splitlab{display:flex;gap:10px;font-size:11px;color:var(--mute);margin-top:5px}
.splitlab span:nth-child(1){color:#3A78C2}.splitlab span:nth-child(2){color:#F3C34A}.splitlab span:nth-child(3){color:#E8274F}
.wline b.pos{color:var(--done)}.wline b.neg{color:#FF6F8A}
.totop{display:block;margin:12px auto 0;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:9px;padding:7px 12px;font:600 12.5px Barlow,system-ui,sans-serif}
.howto{background:var(--card2);color:#8FB8E6;font-size:12.5px;font-weight:600;padding:7px 12px;border-bottom:1px solid var(--line)}
.ex{padding:12px;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.exh{display:flex;gap:8px;align-items:baseline}
.tag{font:600 14px var(--head);color:var(--accent);flex:none;min-width:24px}
.nm{flex:1;font-weight:700;font-size:15.5px;line-height:1.25}
.nm small{display:block;font-weight:500;font-size:12.5px;color:var(--mute)}
.rx{font:600 15px var(--head);color:#8FB8E6;white-space:nowrap;letter-spacing:.2px}
.cue{font-size:12.5px;color:#FF6F8A;font-weight:600;margin:4px 0 0 32px}
.opt{font-size:12.5px;color:var(--mute);margin:3px 0 0 32px}
.opt b{color:#FF6F8A}
.wk{font-size:12.5px;font-weight:600;margin:7px 0 0 32px;background:rgba(243,195,74,.12);color:#F3C34A;border-radius:7px;padding:5px 9px}
.load{font-size:12.5px;color:var(--mute);margin:5px 0 0 32px}
.load b{color:var(--text)}

/* set table */
.sets{margin:10px 0 0 32px;display:grid;gap:5px}
.srow{display:grid;grid-template-columns:54px 1fr auto 40px;align-items:center;gap:8px;padding:4px 4px 4px 8px;border-radius:9px;background:var(--card2);border:1px solid transparent}
.srow.done{background:var(--donebg);border-color:rgba(47,184,115,.45)}
.srow .sl{font:600 12px Barlow,system-ui,sans-serif;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
.srow.warm .sl{color:#F3C34A}
.srow .tg{font:600 15px var(--head);color:var(--text);white-space:nowrap}
.srow .tg small{display:block;font:500 11px Barlow,system-ui,sans-serif;color:var(--dim)}
.ins{display:flex;gap:5px;align-items:center}
.f{position:relative}
.f input{height:38px;border:1px solid #2E4880;border-radius:8px;background:#07122A;color:var(--text);font:700 16px Barlow,system-ui,sans-serif;text-align:center;padding:0 20px 0 4px;width:76px}
.f.reps input{width:54px;padding:0 4px}
.f input:focus{outline:none;border-color:#4C8DD6;box-shadow:0 0 0 3px rgba(76,141,214,.25)}
.f input::placeholder{color:#4F648C;font-weight:500;font-size:13px}
.f span{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:10.5px;color:var(--dim);pointer-events:none}
.f.reps span{display:none}
.ck{width:38px;height:38px;border-radius:9px;border:2px solid #34508A;background:transparent;display:grid;place-items:center;font-size:17px;color:transparent;justify-self:end}
.srow.done .ck{background:var(--done);border-color:var(--done);color:#fff}
.lastwk{grid-column:2/-1;font-size:11.5px;color:var(--dim);margin-top:-2px}
.lastwk b{color:var(--mute)}
.up{color:var(--done);font-weight:700}
.dots{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 0 32px}
.dot{width:40px;height:40px;border-radius:50%;border:2px solid #34508A;display:grid;place-items:center;font:600 15px var(--head);color:var(--mute);background:transparent}
.dot.dash{border-style:dashed}
.dot.on{background:var(--done);border-color:var(--done);color:#fff}
.note{display:block;width:calc(100% - 32px);margin:8px 0 0 32px;border:1px dashed #2E4880;border-radius:8px;background:transparent;font:13px Barlow,system-ui,sans-serif;color:var(--text);padding:7px 9px;resize:none}
.note:focus{outline:none;border-style:solid;border-color:#4C8DD6}
/* warmup */
details.wu summary{list-style:none;cursor:pointer}
details.wu summary::-webkit-details-marker{display:none}
.wurow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.wurow .n{flex:1;font-size:14px}
.wurow .r{color:var(--mute);font-size:12.5px;white-space:nowrap}
.cb{width:24px;height:24px;border-radius:6px;border:2px solid #34508A;display:grid;place-items:center;color:transparent;font-size:13px;flex:none}
.wurow.on .cb{background:var(--done);border-color:var(--done);color:#fff}
.wurow.on .n{color:var(--dim);text-decoration:line-through}
.pill{background:rgba(255,255,255,.14);border-radius:20px;padding:3px 9px;font:600 12px Barlow,system-ui,sans-serif}

/* timer */
#timer{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;max-width:616px;margin:0 auto;background:var(--red);color:#fff;border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,20,50,.35)}
#timer.show{display:flex}
#timer .t{font:700 28px/1 var(--head);min-width:62px;font-variant-numeric:tabular-nums}
#timer .t.go{color:#FF8A9B}
#timer .tb{flex:1;height:6px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden}
#timer .tb i{display:block;height:100%;background:#fff}
#timer button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:8px;padding:8px 10px;font:600 12.5px Barlow,system-ui,sans-serif}

/* progress */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.sum b{display:block;font:700 26px/1.1 var(--head);color:#fff}
.sum span{font-size:11.5px;color:var(--mute)}
.pbody{padding:10px 12px 12px}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end;height:118px;margin-bottom:6px}
.bcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bcol .v{font:600 13px var(--head);color:var(--text);margin-bottom:3px}
.bcol .b{width:70%;max-width:46px;border-radius:6px 6px 2px 2px;background:#3A78C2;min-height:3px}
.bcol.cur .b{background:var(--red)}
.bcol.none .b{background:var(--card2)}
.blab{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;font:600 12px Barlow,system-ui,sans-serif;color:var(--mute)}
.pl{font-size:12px;color:var(--mute);margin-top:8px;border-top:1px solid var(--line);padding-top:7px}
.pl div{display:flex;gap:8px;padding:2px 0}
.pl div b{width:44px;flex:none;color:var(--text)}
.empty{color:var(--dim);font-style:italic}

/* notes/setup */
.nc{padding:12px 14px}
.nc h3{margin:0 0 6px;font:600 17px var(--head);text-transform:uppercase;color:#FF6F8A;letter-spacing:.4px}
.nc p{margin:5px 0;color:var(--mute)}
.nc p b{color:var(--text)}
.nc dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0}
.nc dt{font-weight:700}.nc dd{margin:0;color:var(--mute)}
.rpe div{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.rpe div:first-of-type{border-top:0}
.rpe b{font:700 19px var(--head);color:#FF6F8A;width:28px;flex:none}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.setrow input[type=text],.setrow select{width:100px;border:1px solid #2E4880;border-radius:8px;padding:8px;font:600 15px Barlow,system-ui,sans-serif;text-align:center;background:#07122A;color:var(--text)}
.lslot{display:flex;align-items:center;gap:10px}
.lslot .prev{width:52px;height:52px;border-radius:10px;background:var(--navy);display:grid;place-items:center;overflow:hidden}
.lslot .prev img{max-width:100%;max-height:100%}
.upbtn{border:1px solid #4C8DD6;color:#8FB8E6;background:transparent;border-radius:8px;padding:7px 10px;font:600 13px Barlow,system-ui,sans-serif}
.foot{color:var(--dim);font-size:12px;text-align:center;margin:20px 0 90px}
.tabsel{display:flex;gap:6px;margin:12px 0 0}
.tabsel button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px;font:600 13.5px Barlow,system-ui,sans-serif;color:var(--mute)}
.tabsel button.on{background:var(--red);border-color:var(--red);color:#fff}
/* ---- all-phases additions ---- */
.ptitle{display:block;width:100%;text-align:left;border:0;background:none;padding:0;margin:1px 0 0;color:#fff;font:600 17.5px/1.15 var(--head);text-transform:uppercase;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle .car{color:#FF6F8A;font-size:15px;margin-left:2px}
.rowsel button{flex-direction:column;align-items:center;gap:1px;font-size:11.5px;padding:5px 8px}
.rowsel button b{font-size:14.5px}
.tabsel{gap:5px}.tabsel button{padding:9px 2px;font-size:12.5px}
.dsub{font:600 13px var(--head);text-transform:uppercase;letter-spacing:.6px;color:#FF6F8A;margin-top:3px}
.dsub2{font:600 12px Barlow,system-ui,sans-serif;text-transform:none;color:var(--mute);letter-spacing:0}
.why{background:linear-gradient(90deg,rgba(0,43,92,.55),rgba(27,84,133,.25));border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:#C9D6EA;margin:10px 0}
.why b{display:block;font:600 14px var(--head);text-transform:uppercase;letter-spacing:.5px;color:#fff;margin-bottom:2px}
.vbtn{flex:none;border:0;background:#F3C34A;color:#0B1A33;border-radius:8px;padding:7px 10px;font:700 12.5px Barlow,system-ui,sans-serif;white-space:nowrap;align-self:flex-start}
.vbtn.sm{padding:6px 10px;font-size:12px}
.vbtn.big{display:block;width:100%;padding:11px;font-size:14px;margin-top:8px}
.wurow.plain{cursor:default}
details.soft .chead{background:#0B2147}
.restbtn{padding:5px 8px}
.srow{grid-template-columns:62px 1fr auto 40px}
.srow .sl i{display:block;font:500 10px Barlow,system-ui,sans-serif;font-style:normal;text-transform:none;letter-spacing:0;color:var(--dim)}
.srow.optset{border:1px dashed #34508A;background:transparent}
.srow.optset.done{border-style:solid}
.srow .tg{white-space:normal}
.f.reps.wide input{width:84px}
.ex.orx{border-top:1px dashed #34508A;background:rgba(255,255,255,.02)}
.amrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(243,195,74,.07)}

/* ---- reactions, settings, win screen ---- */
.keybtn.gear{padding:8px 9px;font-size:15px;margin-right:-4px}

#setov .sh button{border:0;background:var(--red);color:#fff;border-radius:8px;padding:8px 14px;font:600 13px Barlow,system-ui,sans-serif}

.trotag{display:inline-block;margin-left:8px;font:700 10px Barlow,system-ui,sans-serif;letter-spacing:.6px;background:rgba(243,195,74,.18);color:#F3C34A;border:1px solid rgba(243,195,74,.5);border-radius:5px;padding:2px 6px;vertical-align:middle}

/* ---- v4: shields, PR mark, big Done stamp, recap, shout-outs, locks, records, test page ---- */
.ex{position:relative}
.bigstamp{display:none;position:absolute;left:50%;top:50%;z-index:3;pointer-events:none;transform:translate(-50%,-50%) rotate(-13deg);font:700 clamp(54px,19vw,104px)/1 var(--head);letter-spacing:6px;text-transform:uppercase;color:rgba(47,184,115,.34);border:7px solid rgba(47,184,115,.34);border-radius:16px;padding:6px 26px 10px;white-space:nowrap;text-shadow:0 0 1px rgba(47,184,115,.3)}
.ex.exdone .bigstamp{display:block}

@keyframes slam{0%{transform:translate(-50%,-50%) rotate(-13deg) scale(3);opacity:0}45%{transform:translate(-50%,-50%) rotate(-13deg) scale(.92);opacity:1;color:rgba(47,184,115,.95);border-color:rgba(47,184,115,.95)}100%{transform:translate(-50%,-50%) rotate(-13deg) scale(1)}}
.bdg{flex:none;display:flex;align-items:center;gap:5px;align-self:flex-start}

.premb.big{width:min(300px,74vw);height:auto;aspect-ratio:260/162;margin:0}
.premb.big img{filter:drop-shadow(0 0 26px rgba(232,39,79,.6)) drop-shadow(0 0 4px rgba(255,255,255,.5))}
.premb.big b{right:-4%;bottom:-13%;font-size:clamp(84px,30vw,128px);-webkit-text-stroke:11px #B30838;text-shadow:0 7px 0 #001A3D,0 0 30px rgba(232,39,79,.75);transform:rotate(-9deg)}
.srow .prtag{display:none;font:800 10px Barlow,system-ui,sans-serif;font-style:normal;letter-spacing:.6px;background:#E8274F;color:#fff;border-radius:4px;padding:1px 5px;margin-top:3px;width:max-content}
.srow.pr .prtag{display:block}

@keyframes prfade{0%{opacity:0}8%{opacity:1}82%{opacity:1}100%{opacity:0}}
.prburst{text-align:center;animation:bpop .7s cubic-bezier(.2,1.5,.4,1)}
.prl{margin-top:54px;font:700 22px var(--head);text-transform:uppercase;letter-spacing:3px;color:#FF6F8A}
.prn{margin-top:4px;font:600 17px Barlow,system-ui,sans-serif;color:#fff}
.recap .rgrid,.wrecap .rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rgrid div{background:var(--card2);border-radius:10px;padding:8px 2px;text-align:center}
.rgrid b{display:block;font:700 20px/1.1 var(--head);color:#fff}.rgrid span{font-size:10.5px;color:var(--mute)}
.rline{margin:10px 0 0;font-size:13px;color:var(--mute)}.rline b{color:#fff}
.tline{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 12px;margin-top:10px;font:600 12.5px Barlow,system-ui,sans-serif;color:#C9D6EA}

.wall{display:grid;gap:8px;margin-top:12px}

.testbar{display:block;width:100%;margin:8px 0 0;border:1px dashed #F3C34A;background:rgba(243,195,74,.1);color:#F3C34A;border-radius:10px;padding:8px;font:600 12.5px Barlow,system-ui,sans-serif}

/* ================= GAME DAY ================= */
:root{--g-ground:#E9EDF3;--g-card:#FFFFFF;--g-ink:#152553;--g-mute:#5B6478;--g-soft:#E9EDF3;--g-line:#D1D3D4;--g-navy:#002B5C;--g-dk:#152553;--g-red:#B30838;--g-dkred:#8B0027;--g-hot:#EE2D28;--g-teal:#0092B7;--g-pill:#C4CAD4;
  --gd:"Barlow Condensed","Oswald","Arial Narrow",sans-serif;--gb:"Barlow",Inter,system-ui,sans-serif}
:root[data-theme="dark"]{--g-ground:#07122A;--g-card:#12244D;--g-ink:#FFFFFF;--g-mute:#A9B8D6;--g-soft:#1B315F;--g-line:#2A4179;--g-pill:#34508A}
html,body{background:var(--g-ground)!important}
body{font-family:var(--gb);color:var(--g-ink);padding:0!important;margin:0}
#main{max-width:520px;margin:0 auto;padding:0 0 108px;min-height:100vh;position:relative}
#main button{font-family:inherit;cursor:pointer}
.hero{position:relative;overflow:hidden;color:#fff}
.hero .hbg,.hero .hred{position:absolute;inset:0}
.hero .hbg{background:var(--g-navy);clip-path:polygon(0 0,100% 0,100% 84%,0 100%)}
.hero .hred{background:var(--g-red);clip-path:polygon(64% 0,100% 0,100% 84%)}
.hero.tbar .hred,.hero.mid .hred{clip-path:polygon(80% 0,100% 0,100% 84%)}
.hero .claws{position:absolute;right:-26px;top:44px;display:flex;gap:16px;transform:skewX(-18deg);opacity:.14}
.hero .claws i{display:block;width:22px;height:230px;background:#fff;border-radius:12px}
.hero .claws i:nth-child(2){height:200px}.hero .claws i:nth-child(3){height:170px}
.hero.tbar .claws,.hero.mid .claws{display:none}
.hin{position:relative;padding:calc(18px + env(safe-area-inset-top)) 22px 58px;display:flex;flex-direction:column;gap:16px}
.hero.tbar .hin{padding-bottom:34px}.hero.mid .hin{padding-bottom:44px;gap:12px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hlogo{width:74px;height:46px;object-fit:contain}.hlogo.sm{width:56px;height:36px}
.hpill{display:flex;align-items:center;gap:8px;border:0;background:rgba(255,255,255,.14);border-radius:22px;padding:8px 14px 8px 10px;color:#fff;font:700 15px var(--gb)}
.ibtn{width:44px;height:44px;flex:none;border:0;border-radius:14px;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center}
.ibtn.light{background:var(--g-card);color:var(--g-ink)}
.ttl{text-align:center;min-width:0}
.ttl b{display:block;font:italic 800 28px/1 var(--gd);text-transform:uppercase;letter-spacing:.5px}
.ttl small{display:block;font:600 12px var(--gb);color:#D1D3D4;margin-top:2px}
.kick{border:0;background:none;padding:0;text-align:left;font:700 14px var(--gd);letter-spacing:2.5px;text-transform:uppercase;color:#D1D3D4}
.hday h1{white-space:nowrap;margin:2px 0 0;font:italic 800 clamp(58px,19vw,78px)/.92 var(--gd);text-transform:uppercase;color:#fff;letter-spacing:-.5px}
.hday h1.long{font-size:clamp(40px,13.6vw,60px)}
.hsub{font:italic 700 25px/1.05 var(--gd);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.hgo{display:flex;align-items:center;gap:16px;padding-left:6px}
.skew{display:block;border:0;height:60px;padding:0 22px;border-radius:10px;font:italic 800 27px/1 var(--gd);letter-spacing:2px;text-transform:uppercase;transform:skewX(-10deg)}
.skew.white{background:#fff;color:var(--g-red);box-shadow:6px 6px 0 var(--g-dkred);flex:1}
.skew.red{background:var(--g-red);color:#fff;box-shadow:6px 6px 0 var(--g-dk);width:calc(100% - 12px);margin:14px 0 6px 4px}
:root[data-theme="dark"] .skew.red{box-shadow:6px 6px 0 #000}
.skew.red.done{height:66px;font-size:34px;letter-spacing:3px;margin-top:4px}
.skew.red.sm{height:52px;font-size:22px;margin:0;width:auto;flex:1}
.skew:active{transform:skewX(-10deg) translate(3px,3px);box-shadow:3px 3px 0 var(--g-dk)}
.ring{--p:0;width:64px;height:64px;flex:none;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.28) 0);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;color:#fff}
.ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--g-navy)}
.ring b,.ring small{position:relative}.ring b{font:700 19px/1 var(--gd)}.ring small{font:600 9px/1.2 var(--gb);letter-spacing:1px;text-transform:uppercase}
.body{position:relative;margin-top:-22px;padding:0 18px;display:flex;flex-direction:column;gap:13px}
.hero.tbar+.body,.hero.tbar+.wkrow{margin-top:-8px}
.link{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:6px 0;color:var(--g-red);font:700 14px var(--gb);align-self:flex-start}
:root[data-theme="dark"] .link{color:#FF6F8A}
.link svg{width:16px;height:16px}
.wkrow{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.wkrow.pad{padding:0 18px 12px;position:relative}
.wkrow button{flex:1;min-width:64px;border:0;border-radius:11px;background:var(--g-card);color:var(--g-mute);padding:9px 6px;font:700 15px var(--gd);letter-spacing:.8px;text-transform:uppercase;white-space:nowrap}
.wkrow button.on{background:var(--g-dk);color:#fff}
:root[data-theme="dark"] .wkrow button.on{background:#fff;color:var(--g-dk)}
.days{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}.days.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.dcard{border:0;text-align:left;background:var(--g-card);color:var(--g-ink);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.dcard .dk{font:700 12px var(--gd);letter-spacing:1.8px;text-transform:uppercase;color:var(--g-mute)}
.dcard b{font:italic 800 24px/1 var(--gd);text-transform:uppercase}
.dcard .dm{font:600 12px var(--gb);color:var(--g-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard.on{background:var(--g-navy);color:#fff;box-shadow:0 0 0 3px var(--g-red)}
.dcard.on .dk,.dcard.on .dm{color:#D1D3D4}
.dcard.done .dm{color:var(--g-teal);font-weight:700}.dcard.on.done .dm{color:#7FD6EC}
.gcard{background:var(--g-card);border-radius:18px;padding:16px}
.gcard.flush{padding:4px 0}
.gcard h2{margin:0;font:italic 800 24px/1 var(--gd);text-transform:uppercase}
.gcard h3{margin:0 0 4px;font:700 14px var(--gd);letter-spacing:2px;text-transform:uppercase;color:var(--g-red)}
:root[data-theme="dark"] .gcard h3{color:#FF6F8A}
.ghead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.ghead span{font:600 13px var(--gb);color:var(--g-mute)}
.gp{margin:6px 0 0;font:500 14px/1.45 var(--gb);color:var(--g-mute)}.gp b{color:var(--g-ink)}
.gp.lead{margin:6px 2px 0}
.lrows{display:flex;flex-direction:column;gap:4px}
.lrow{display:flex;align-items:center;gap:12px;border:0;background:none;padding:6px 0;text-align:left;color:var(--g-ink);width:100%}
.lrow>svg{flex:none;color:var(--g-pill)}
.chip{width:36px;height:36px;flex:none;border-radius:9px;background:var(--g-red);color:#fff;font:italic 800 20px var(--gd);display:flex;align-items:center;justify-content:center;transform:skewX(-8deg)}
.chip.teal{background:var(--g-teal)}.chip svg{transform:skewX(8deg)}
.ln{flex:1;min-width:0}.ln b{display:block;font:600 15px/1.25 var(--gb)}.ln small{font:500 12.5px var(--gb);color:var(--g-mute)}
.lrow.done .ln b{color:var(--g-mute)}
.nextb,.upnext{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;text-align:left;background:var(--g-dk);color:#fff;border-radius:16px;padding:12px 14px}
:root[data-theme="dark"] .nextb,:root[data-theme="dark"] .upnext{background:#1B315F}
.nextb small,.upnext small{display:block;font:700 11px var(--gb);letter-spacing:1.5px;text-transform:uppercase;color:#D1D3D4}
.nextb b,.upnext b{display:block;font:600 15px/1.3 var(--gb)}
.recap2 summary{list-style:none;display:flex;align-items:baseline;justify-content:space-between;cursor:pointer}
.recap2 summary::-webkit-details-marker{display:none}.recap2 summary span{font:600 13px var(--gb);color:var(--g-mute)}
.legacy{position:relative;margin:-8px 12px 0;background:#07122A;border-radius:22px;padding:6px 12px 14px;color:var(--text)}
.legacy.in{margin:12px 0 0;padding:12px;border-radius:14px}
.legacy .sumhead:first-child{margin-top:10px}
.resetday{display:block;margin:6px auto 0;border:1px solid var(--g-line);background:transparent;color:var(--g-mute);border-radius:10px;padding:9px 14px;font:600 13px var(--gb)}
.resetday.arm{background:var(--g-red);border-color:var(--g-red);color:#fff}
.foot2{text-align:center;font:500 12px var(--gb);color:var(--g-mute);margin:8px 0}
/* lineup */
.path{gap:12px;margin-top:-2px}
.path::before{content:"";position:absolute;left:35px;top:20px;bottom:150px;width:6px;border-radius:3px;background:var(--g-line)}
.stop{position:relative;display:flex;align-items:center;gap:14px;border:0;background:none;padding:0;text-align:left;color:var(--g-ink);width:100%}
.stop.cur{align-items:flex-start}
.sdot{width:40px;height:40px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font:italic 800 20px var(--gd);box-shadow:0 0 0 4px var(--g-ground)}
.sdot.teal{background:var(--g-teal);color:#fff}.sdot.navy{background:var(--g-dk);color:#fff}
.sdot.line{background:var(--g-card);border:3px solid var(--g-pill);box-sizing:border-box;color:var(--g-mute)}
.sdot.ghost{background:var(--g-ground);border:2px dashed var(--g-pill);box-sizing:border-box;color:var(--g-mute);font:700 12px var(--gb)}
.sdot.red{background:var(--g-red);color:#fff;margin-top:12px;font-size:22px;box-shadow:0 0 0 4px var(--g-ground),0 0 0 7px var(--g-red)}
.tile{flex:1;min-width:0;background:var(--g-card);border-radius:14px;padding:11px 14px;display:flex;flex-direction:column;gap:2px}
.tile b{font:italic 800 20px/1.05 var(--gd);text-transform:uppercase}
.tile small{font:600 13px/1.3 var(--gb);color:var(--g-mute)}
.stop.done .tile b,.stop.sopt .tile b{color:var(--g-mute)}
.stop.sopt .tile{background:transparent;border:2px dashed var(--g-line);padding:8px 14px}
.tile.dash{background:transparent;border:2px dashed var(--g-pill)}
.tile.big{background:var(--g-navy);color:#fff;border-radius:18px;padding:16px;gap:12px;box-shadow:6px 6px 0 var(--g-red)}
.thead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.thead b{font-size:26px}.thead span{font:700 12px var(--gb);letter-spacing:1px;text-transform:uppercase;color:#D1D3D4;white-space:nowrap}
.exl{display:flex;flex-direction:column;gap:5px;font:600 15px var(--gb)}
.pills{display:flex;gap:5px;flex-wrap:wrap}.pills i{width:30px;height:10px;border-radius:5px;background:rgba(255,255,255,.25)}.pills i.on{background:#fff}
.tile.big .skew{height:52px;flex:none;width:100%;font-size:24px;box-shadow:none;margin-top:2px}
.prow{display:flex;align-items:center;gap:10px}
.pbar{flex:1;height:12px;border-radius:8px;background:rgba(255,255,255,.2);overflow:hidden}.pbar i{display:block;height:100%;background:#fff;border-radius:8px}
.prow span{font:700 14px var(--gd);letter-spacing:1px}
/* warm-up */
.wrow2{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--g-soft);cursor:pointer;user-select:none}
.wrow2:first-child{border-top:0}.wrow2.plain{cursor:default}
.cbx{width:30px;height:30px;flex:none;border-radius:9px;border:2.5px solid var(--g-pill);display:flex;align-items:center;justify-content:center;color:transparent}
.wrow2.on .cbx{background:var(--g-teal);border-color:var(--g-teal);color:#fff}
.wn{flex:1;min-width:0}.wn b{display:block;font:600 15px/1.25 var(--gb)}.wn small{font:500 12.5px var(--gb);color:var(--g-mute)}
.wrow2.on .wn b{color:var(--g-mute);text-decoration:line-through}
.vmini{width:40px;height:40px;flex:none;border:0;border-radius:50%;background:var(--g-red);color:#fff;display:flex;align-items:center;justify-content:center}
.vmini svg{width:17px;height:17px;margin-left:2px}
/* one lift at a time */
.lift{padding:calc(14px + env(safe-area-inset-top)) 18px 24px;display:flex;flex-direction:column;gap:12px}
.ltop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.spills{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:center}
.spills button{width:24px;height:10px;border:0;padding:0;border-radius:5px;background:var(--g-pill);position:relative}
.spills button::after{content:"";position:absolute;inset:-14px -2px}
.spills button.wu{width:14px}.spills button.opt{background:transparent;border:2px dashed var(--g-pill);box-sizing:border-box}
.spills button.on{background:var(--g-teal);border:0}
.spills button.cur{width:36px;height:14px;border-radius:7px;background:var(--g-red)}.spills button.cur.on{background:var(--g-teal);box-shadow:0 0 0 2.5px var(--g-red)}
.restring{width:46px;height:46px;flex:none;border-radius:50%;border:4px solid var(--g-teal);background:transparent;color:var(--g-ink);font:700 14px var(--gd)}
.exchips{display:flex;align-items:center;gap:7px}
.exchips button{border:0;border-radius:9px;background:var(--g-card);color:var(--g-mute);padding:7px 13px;font:italic 800 17px var(--gd)}
.exchips button.on{background:var(--g-red);color:#fff;transform:skewX(-8deg)}
.exchips button.dn:not(.on){color:var(--g-teal)}
.exchips span{margin-left:auto;font:700 12px var(--gb);letter-spacing:1.3px;text-transform:uppercase;color:var(--g-mute);text-align:right}
.amrap2{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--g-card);border-radius:14px;padding:8px 12px}
.gsm{border:0;border-radius:10px;background:var(--g-teal);color:#fff;padding:10px 12px;font:700 14px var(--gb)}
.amrap2 label{display:flex;align-items:center;gap:8px;font:700 13px var(--gb);color:var(--g-mute)}
.amrap2 input{width:60px;height:40px;border:2px solid var(--g-line);border-radius:10px;background:var(--g-card);color:var(--g-ink);font:700 18px var(--gd);text-align:center}
.vcard{position:relative;display:block;width:100%;height:132px;border:0;border-radius:20px;background:var(--g-navy);overflow:hidden;color:#fff;padding:0}
.vbg{position:absolute;inset:0;background:linear-gradient(var(--g-red),var(--g-red)) no-repeat;clip-path:polygon(72% 0,100% 0,100% 100%,88% 100%)}
.vcard::before{content:"";position:absolute;inset:0;background:var(--g-dk);clip-path:polygon(0 60%,44% 100%,0 100%)}
.vtag{position:absolute;left:14px;top:12px;font:700 12px var(--gb);letter-spacing:1.5px;text-transform:uppercase}
.vsub2{position:absolute;left:14px;bottom:12px;font:600 13px var(--gb)}
.vplay{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:#fff;color:var(--g-red);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.vplay svg{margin-left:3px}
.ltag{display:flex;align-items:center;gap:8px;font:700 12px var(--gb);letter-spacing:1.2px;text-transform:uppercase;color:var(--g-mute)}
.tagc{flex:none;font:italic 800 18px var(--gd);letter-spacing:0;color:#fff;background:var(--g-red);border-radius:7px;padding:1px 9px;transform:skewX(-8deg)}
.lrow2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.lname h1{margin:0;font:italic 800 clamp(28px,9.4vw,38px)/.98 var(--gd);text-transform:uppercase;color:var(--g-ink)}
.lplan{font:600 13.5px var(--gb);color:var(--g-mute);margin-top:3px}
.lname .bdg{align-self:center}.lname .shield{width:38px;height:44px}
.setcard{position:relative;background:var(--g-card);border-radius:22px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.shead b{font:italic 800 26px/1 var(--gd);text-transform:uppercase;color:var(--g-red)}
:root[data-theme="dark"] .shead b{color:#FF6F8A}
.shead b.wu{color:var(--g-teal)}
.shead span{font:700 20px/1 var(--gd);text-transform:uppercase;text-align:right}
.sextra{font:600 13px var(--gb);color:var(--g-mute);margin-top:-6px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stepper>button{width:64px;height:64px;flex:none;border:0;border-radius:18px;background:var(--g-soft);color:var(--g-ink);font:700 22px var(--gd)}
.stepper>button:active{background:var(--g-pill)}
.wbig{display:flex;align-items:baseline;justify-content:center;gap:6px;min-width:0}
.wbig input{width:170px;max-width:46vw;border:0;background:transparent;text-align:center;font:italic 800 84px/.95 var(--gd);color:var(--g-navy);padding:0;outline:none}
:root[data-theme="dark"] .wbig input{color:#fff}
.wbig input::placeholder{color:var(--g-pill)}
.wbig span{font:700 20px var(--gd);color:var(--g-mute)}
.repsin{display:flex;align-items:center;justify-content:center;gap:10px;font:700 14px var(--gb);color:var(--g-mute)}
.repsin input{width:92px;height:46px;border:2px solid var(--g-line);border-radius:12px;background:var(--g-card);color:var(--g-ink);font:700 22px var(--gd);text-align:center}
.lastl{text-align:center;font:600 14px/1.35 var(--gb);color:var(--g-mute);min-height:6px}
.tgo{display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:16px;background:var(--g-teal);color:#fff;height:60px;font:700 17px var(--gb)}
.drow{display:flex;gap:14px;align-items:center;padding:4px 6px 4px 0}
.undo{flex:1;height:52px;border:2px solid var(--g-teal);border-radius:12px;background:transparent;color:var(--g-teal);font:700 14px var(--gb)}
:root[data-theme="dark"] .undo{color:#7FD6EC}
.setcard .bigstamp{font-size:clamp(50px,17vw,84px);border-width:6px;color:rgba(0,146,183,.2);border-color:rgba(0,146,183,.2)}
.setcard.exdone .bigstamp{display:block}
.slamfx{position:fixed;inset:0;z-index:96;pointer-events:none;display:flex;align-items:center;justify-content:center}
.slamfx span{font:italic 800 clamp(64px,24vw,118px)/1 var(--gd);letter-spacing:6px;text-transform:uppercase;color:var(--g-teal);border:9px solid var(--g-teal);border-radius:20px;padding:0 26px 6px;background:rgba(255,255,255,.9);transform:rotate(-12deg);animation:slamfx 1s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes slamfx{0%{transform:rotate(-12deg) scale(3);opacity:0}30%{transform:rotate(-12deg) scale(.94);opacity:1}40%{transform:rotate(-12deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:rotate(-12deg) scale(1)}}
.fly.shf{font-size:0}.fly.shf .shield{width:44px;height:50px}
.bubble{display:flex;gap:10px;align-items:flex-start}
.bubble .av{width:34px;height:34px;flex:none;border-radius:50%;background:var(--g-dk);color:#fff;font:700 11px var(--gb);display:flex;align-items:center;justify-content:center}
.bubble div{background:var(--g-card);border-radius:4px 16px 16px 16px;padding:9px 12px;font:600 13.5px/1.4 var(--gb)}
.more2{background:var(--g-card);border-radius:16px}
.more2 summary{list-style:none;cursor:pointer;padding:13px 14px;font:700 14px var(--gb);color:var(--g-mute)}
.more2 summary::-webkit-details-marker{display:none}
.more2 summary::after{content:"+";float:right;font:700 20px/1 var(--gd)}.more2[open] summary::after{content:"–"}
.mbody{padding:0 14px 14px;font:500 13.5px/1.45 var(--gb);color:var(--g-mute)}
.mbody p{margin:0 0 7px}.mbody b{color:var(--g-ink)}.mbody a{color:var(--g-teal);font-weight:700}
.mbody .cuel{color:var(--g-red);font-weight:700}:root[data-theme="dark"] .mbody .cuel{color:#FF6F8A}
.mbody h4{margin:10px 0 4px;font:700 13px var(--gd);letter-spacing:2px;text-transform:uppercase;color:var(--g-ink)}
.mbody ol{margin:0 0 10px;padding-left:20px;display:grid;gap:5px}
.abbr2{display:flex;flex-wrap:wrap;gap:4px 12px;margin:0 0 6px;font-size:12.5px}
.note2{display:block;width:100%;box-sizing:border-box;border:2px dashed var(--g-line);border-radius:12px;background:transparent;color:var(--g-ink);font:500 14px var(--gb);padding:9px 10px;resize:none}
/* trophies + more */
.shelf{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tro{position:relative;overflow:hidden;border:0;border-radius:14px;background:var(--g-soft);color:var(--g-pill);height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tro svg,.tro b{position:relative;z-index:1}.tro b{font:700 14px var(--gd);color:var(--g-mute)}
.tro i{position:absolute;left:0;right:0;bottom:0;background:rgba(0,146,183,.25)}
.tro.won{background:var(--g-navy);color:#F2C744}.tro.won b{color:#fff}.tro.won i{display:none}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tl{background:var(--g-card);border-radius:16px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:104px;justify-content:flex-end}
.tl .shield{width:34px;height:39px}.tl b{font:italic 800 30px/1 var(--gd)}.tl span{font:700 11px var(--gb);letter-spacing:1px;text-transform:uppercase;color:var(--g-mute)}
.tl.navy{background:var(--g-navy);color:#fff}.tl.navy span{color:#D1D3D4}.tl.navy .premb{margin:0 8px 6px 0;width:48px;height:30px}
.recs{display:flex;flex-direction:column}
.rec{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--g-soft)}
.rec:first-child{border-top:0}
.rec b{display:block;font:600 15px/1.25 var(--gb)}.rec small{font:500 12.5px var(--gb);color:var(--g-mute)}
.rec em{font:italic 800 28px/1 var(--gd);font-style:italic;white-space:nowrap}.rec em small{font:700 12px var(--gd);margin-left:2px}
.mrow2{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;border-top:1px solid var(--g-soft);background:none;text-align:left;color:var(--g-ink);padding:14px 16px}
.gcard.flush .mrow2:first-child{border-top:0}
.mrow2 b{display:block;font:italic 800 21px/1.1 var(--gd);text-transform:uppercase}.mrow2 small{font:500 13px var(--gb);color:var(--g-mute)}
.mrow2>svg{flex:none;color:var(--g-pill)}
.mrow2.temp{border:2px dashed #C99A1C;border-radius:16px}
/* bottom bar */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(492px,calc(100% - 28px));height:66px;z-index:40;background:var(--g-dk);border-radius:22px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;box-shadow:0 10px 24px rgba(10,20,50,.38)}
:root[data-theme="dark"] #nav{background:#1B315F}
#nav button{border:0;background:none;color:#D1D3D4;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 12px var(--gb);cursor:pointer;padding:6px 0}

async function bootData(db,user,id){try{DB=db;UID=id;

    if(JSON.stringify(m)!==JSON.stringify(R))dirty.add(d.id)});

/* ======================= HELPERS ======================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LET="ABCDEFGH";
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const md=dt=>(dt.getMonth()+1)+"/"+dt.getDate();
const mdy=dt=>md(dt)+"/"+String(dt.getFullYear()).slice(2);
const nice=dt=>MON[dt.getMonth()]+" "+dt.getDate();
const addD=(dt,n)=>{const x=new Date(dt);x.setDate(x.getDate()+n);return x};
function dayDate(p,w,dk){const Q=PH[p],D=Q.days.find(x=>x.k===dk);const ov=Q.dateov&&Q.dateov[w+"-"+dk];if(ov)return pd(ov);if(!D||D.off==null)return null;return addD(pd(Q.weeks[w].mon),D.off)}
const weekRange=(p,w)=>{const m=pd(PH[p].weeks[w].mon);return md(m)+" – "+md(addD(m,6))};
function phaseRange(p){const Q=PH[p],a=pd(Q.weeks[0].mon),last=Q.weeks.length-1;let b=addD(pd(Q.weeks[last].mon),6);
  const offs=Q.days.map(d=>d.off).filter(o=>o!=null);if(offs.length)b=addD(pd(Q.weeks[last].mon),Math.max(...offs));
  return nice(a)+" – "+nice(b)}
const wkLabel=p=>{const W=PH[p].weeks;return W.length>1?"Wk "+W[0].n+"-"+W[W.length-1].n:"Wk "+W[0].n};
const Wk=(e,w)=>e.weeks[Math.min(w,e.weeks.length-1)];
const skipMsg=(p,w,d)=>(PH[p].skip||{})[w+"-"+d]||"";
/* rows of one exercise for one week: warm-ups first, then working sets */
function rows(W){if(!W||W.count)return[];const out=[];(W.wu||[]).forEach(([t,lab])=>out.push({t,lab,warm:1}));
  const solo=W.sets.length===1&&!W.wu;W.sets.forEach((t,i)=>out.push({t,lab:solo?"Done":"Set "+(i+1),opt:W.min&&i>=W.min?1:0}));return out}
const need=W=>W.count?0:(W.wu||[]).length+(W.min||W.sets.length);
function exGot(r,W,id){if(r&&r.x&&(r.x.inj||r.x["i"+id]))return W.count?1:need(W);if(W.count)return Math.min(1,((r&&r.c&&r.c[id])||0)/(W.min||W.count));let n=0;rows(W).forEach((_,si)=>{const v=r&&r.s&&r.s[id+"."+si];if(v&&v.d)n++});return Math.min(n,need(W))}
function dayPct(p,w,d){if(skipMsg(p,w,d))return null;const Q=PH[p],r=peek(p,w,d),wu=Q.warm[d]||[];let tot=0,got=0;
  if(wu.length){tot++;if(r&&r.x&&r.x.inj)got+=1;else if(r&&r.u)got+=Math.min(1,Object.keys(r.u).length/wu.length)}
  (Q.prog[d]||[]).forEach((b,bi)=>{let pend=null;b.ex.forEach((e,ei)=>{const W=Wk(e,w);if(!W)return;const id=bi+"."+ei,t=W.count?1:need(W),g=exGot(r,W,id);
    if(e.or&&pend){const best=Math.max(pend.g,Math.min(g,pend.t));got+=best-pend.g;pend.g=best;return}
    tot+=t;got+=g;pend={t,g}})});
  return tot?Math.min(1,got/tot):null}
const isDone=(p,w,d)=>{const x=dayPct(p,w,d);return x!=null&&x>=.999};
function lastVal(bi,ei,si){for(let w=wk-1;w>=0;w--){const p=peek(ph,w,day);const v=p&&p.s&&p.s[bi+"."+ei+"."+si];if(v&&(v.w||v.r))return{w,v}}return null}
function topSet(p,w,d,bi,ei){const r=peek(p,w,d),W=Wk(PH[p].prog[d][bi].ex[ei],w);if(!r||!r.s||!W||W.count)return 0;let t=0;rows(W).forEach((R,si)=>{if(R.warm)return;const v=r.s[bi+"."+ei+"."+si];if(v&&+v.w>t)t=+v.w});return t}
function phaseSessions(p){let done=0,tot=0;PH[p].weeks.forEach((_,w)=>PH[p].days.forEach(D=>{const x=dayPct(p,w,D.k);if(x==null)return;tot++;if(x>=.999)done++}));return{done,tot}}

/* where is "today" in the season? */
function findToday(){const t=new Date();t.setHours(0,0,0,0);let hit=null;
  PH.forEach((Q,p)=>Q.weeks.forEach((W,w)=>{const m=pd(W.mon);if(t>=m&&t<addD(m,7))hit={p,w}}));
  if(!hit){if(t<pd(PH[0].weeks[0].mon))hit={p:0,w:0,pre:1};else{const lp=PH.length-1;hit={p:lp,w:PH[lp].weeks.length-1,post:1}}}
  const Q=PH[hit.p];let d=null;
  Q.days.forEach(D=>{if(d)return;if(skipMsg(hit.p,hit.w,D.k))return;const dt=dayDate(hit.p,hit.w,D.k);
    if(dt){if(dt>=t)d=D.k}else if(!isDone(hit.p,hit.w,D.k))d=D.k});
  if(!d){const ok=Q.days.filter(D=>!skipMsg(hit.p,hit.w,D.k));d=ok[ok.length-1].k}
  return{p:hit.p,w:hit.w,d,pre:hit.pre,post:hit.post}}

const WU_PLAIN={"x5e":"5 each side","x3e":"3 each side","x3":"3 reps","x3 (all)":"3 of the full series","x2 ea. way, ea. leg":"2 each direction, each leg","x10yd ea.":"10 yd each","x20-30yd ea.":"20-30 yd each","x2-3 ea. way":"2-3 each way","x1 ea.":"1 each way","x5 + 3e":"5 rocks + 3 reaches each side"};
function parseT(t,e){const s=String(t).trim().replace(/^x\s*/,"");let m;const side=e&&/sprint|shuffle|crawl|carry|hip flip/i.test(e.name)?"way":"side";
  if(m=/^(\d+(?:-\d+)?)\s*RM(\s*ea\.?)?$/i.exec(s))return{big:m[1]+" RM",small:m[2]?"each side":"",rm:1,inR:1};
  if(m=/^max time(\s*ea\.?)?$/i.exec(s))return{big:"MAX",small:"time"+(m[1]?" · each side":"")};
  if(m=/^(\d+)\s*E\/W\/L$/i.exec(s))return{big:m[1],small:"each way, each leg"};
  if(m=/^([\d\-]+)\s*sec(\s*ea\.?)?$/i.exec(s)){const n=+m[1].split("-").pop();return{big:m[1]+"s",small:m[2]?"each side":"",secs:n,sides:!!m[2]}}
  if(m=/^([\d\-]+)\s*yd(\s*ea\.?)?$/i.exec(s))return{big:m[1]+" yd",small:m[2]?"each way":""};
  if(m=/^(\d[\d\-+,]*)\s*(ea\.?|e)?\s*(leg|way|side)?\s*(\(.*\))?$/i.exec(s)){const each=!!m[2];
    return{big:m[1],small:(each?"each "+(m[3]||side).toLowerCase():/,/.test(m[1])?"cluster":m[1]==="1"?"rep":"reps")+(m[4]?" "+m[4]:""),inR:/\d-\d|\+/.test(m[1])&&!/,/.test(m[1])?1:0,each}}
  return{big:s,small:"",raw:1}}
const tail=p=>p.small?" "+(p.small==="cluster"?"(cluster)":p.small):"";
function countPlain(W){return W.min?`${W.min}-${W.count} sprints of ${W.rx.split(" ×")[0].replace("yd"," yd")}`:`${W.count} reps (${W.count/2} starting each way)`}
function setsPhrase(W,e){if(W.rx)return W.rx;if(W.count)return countPlain(W);const Q=W.sets.map(t=>parseT(t,e)),n=W.sets.length,same=Q.every(q=>q.big===Q[0].big&&q.small===Q[0].small);
  const cnt=W.min?W.min+"-"+n:n;
  if(n===1&&Q[0].raw)return Q[0].big;
  if(n===1)return Q[0].big+tail(Q[0]);
  if(same)return `${cnt} sets × ${Q[0].big}${tail(Q[0])}`;
  const es=Q.some(q=>q.each||/each side/.test(q.small));
  return `${cnt} sets: ${Q.map(q=>q.big).join(", ")}${es?" · each side":""}`}

function blockSteps(b,bi){const Lt=LET[bi],out=[],lift=b.ex.map((e,i)=>({e,i,W:Wk(e,wk)})).filter(x=>x.W);
  (b.note||[]).forEach(n=>out.push(`<b>${esc(n)}</b>`));
  if(!lift.length)return out;
  if(lift[0].W.count){out.push(`Do <b>${countPlain(lift[0].W)}</b>.`);out.push(esc(b.rest)+".");return out}
  lift.filter(x=>x.W.wu).forEach(x=>{const n=x.W.wu.length,bu=/build/i.test(x.W.wu[0][1]);
    out.push(`<b>${n>1?n+" "+(bu?"build-up":"warm-up")+" sets":(bu?"Build-up":"Warm-up")+" set"}</b> first on ${Lt}${x.i+1} ${esc(x.e.name)} — these don't count as working sets.`)});
  const real=lift.filter(x=>!x.e.or),mx=Math.max(...real.map(x=>x.W.sets.length)),mn=Math.min(...real.map(x=>x.W.min||x.W.sets.length));
  const pre=out.length>(b.note||[]).length?"Then do":"Do";
  if(b.amrap)out.push(`<b>${b.amrap}-minute clock:</b> one set of ${real.map(x=>Lt+(x.i+1)).join(" → ")}, then repeat. Count your rounds.`);
  else if(b.seq)out.push(`Go <b>one exercise at a time</b>: finish every set of ${Lt}1 before you move on to ${Lt}2.`);
  else if(real.length>1)out.push(`${pre} <b>${mn<mx?mn+"-"+mx:mx} rounds</b>: one set of ${real.map(x=>Lt+(x.i+1)).join(" → ")}, then repeat. Each round = 1 set of each exercise.`);
  else if(mx>1)out.push(`${pre} <b>${mn<mx?mn+"-"+mx:mx} working sets</b>.`);else out.push(`Check it off when you\'ve finished all of it.`);
  if(lift.some(x=>x.e.or))out.push(`<b>Pick one</b> where it says "pick one" — you don't do both.`);
  if(lift.some(x=>x.W.min))out.push(`Where you see a range of sets, <b>you pick</b>. Dashed sets are optional.`);
  out.push(esc(b.rest)+".");
  lift.filter(x=>isTimed(x.W)).forEach(x=>out.push(`⏱ ${Lt}${x.i+1} is <b>timed</b> — tap ▶ on each set to use the built-in timer.`));
  return out}

function plot(vals,labels,curI,unit){const W=320,H=150,L=14,R=14,T=26,B=24,n=vals.length,has=vals.filter(v=>v>0);if(!has.length)return "";
  const lo=Math.min(...has),hi=Math.max(...has),pad=(hi-lo)*.25||hi*.1||1,y0=lo-pad,y1=hi+pad,X=i=>n===1?W/2:L+18+(W-L-R-36)*i/(n-1),Y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0));
  let path="",prev=false;vals.forEach((v,i)=>{if(v>0){path+=(prev?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1);prev=true}});

    <path class="pline" d="${path}"/>
    ${vals.map((v,i)=>`<text class="px" x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(labels[i])}</text>`+(v>0?`<circle class="pdot ${i===curI?"cur":""}" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${i===curI?6.5:5}"/><text class="pv" x="${X(i).toFixed(1)}" y="${(Y(v)-11).toFixed(1)}" text-anchor="middle">${fm(v)}</text>`:"")).join("")}</svg>`}
function volumePlot(){const Q=P(),vals=Q.weeks.map((_,w)=>Q.days.reduce((n,D)=>n+(skipMsg(ph,w,D.k)?0:sessionStats(ph,w,D.k).lb),0));

/* timer — timed holds, rest between sets, and circuit clocks */
let tInt=null,AC=null,phases=[],pi=0,pEnd=0,holdKey=null,holdCtx=null,timerAuto=false;
const clock=s=>s>=60?Math.floor(s/60)+":"+String(s%60).padStart(2,"0"):s+"s";
function startTimer(list,key,auto){$("#toff").hidden=!auto;timerAuto=!!auto;if(CFG.mute){}else try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}
  phases=list;pi=0;holdKey=key;holdCtx=key?{ph,wk,day}:null;runPhase()}
function runPhase(){const[lab,s]=phases[pi];$("#tl").textContent=lab;pEnd=Date.now()+s*1000;$("#timer").classList.add("show");clearInterval(tInt);
  const tick=()=>{const left=Math.ceil((pEnd-Date.now())/1000);$("#tt").textContent=clock(Math.max(0,left));$("#tb").style.width=Math.max(0,100*left/s)+"%";
    if(left<=0){clearInterval(tInt);beep(pi<phases.length-1?1:3);if(pi<phases.length-1){pi++;runPhase()}else{$("#tt").textContent="Done";$("#tl").textContent=holdKey?"Nice":"Time";finishHold();setTimeout(hideTimer,2500)}}};
  tick();tInt=setInterval(tick,200)}
function finishHold(){if(!holdKey||!holdCtx)return;const c=holdCtx,hk=holdKey;holdKey=null;
  if(c.ph===ph&&c.wk===wk&&c.day===day&&view==="station"&&typeof stn==="number"){logSet(hk,null);return}
  const r=rec(c.ph,c.wk,c.day),v=r.s[hk]=r.s[hk]||{};v.d=1;v.t=v.t||todayISO();save(K(c.ph,c.wk,c.day));if(c.ph===ph&&c.wk===wk&&c.day===day){checkWin();render()}}
function hideTimer(){clearInterval(tInt);$("#timer").classList.remove("show")}
function beep(n){if(CFG.mute)return;try{for(let i=0;i<n;i++){const t=i*.25,o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.2,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+.2);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.21)}}catch(e){}try{navigator.vibrate&&navigator.vibrate(n>1?[200,100,200]:[150])}catch(e){}}

function bestBefore(e,p,w,d){const di=PH[p].days.findIndex(D=>D.k===d),lim=ord(p,w,di);let best=0;
  (NAMEIDX[nrm(e.name)]||[]).forEach(L=>PH[L.p].weeks.forEach((_,wi)=>{if(ord(L.p,wi,L.di)<lim){const t=topSet(L.p,wi,L.d,L.bi,L.ei);if(t>best)best=t}}));return best}
function exState(bi,ei,p,w,d){if(p===undefined){p=ph;w=wk;d=day}const e=PH[p].prog[d][bi].ex[ei],W=Wk(e,w),r=peek(p,w,d)||{s:{},c:{}};
  if(!W)return{done:false,tier:0,diff:0,pr:false,top:0,topRow:-1};
  let top=0,topRow=-1,diff=0;rows(W).forEach((R,si)=>{if(R.warm)return;const v=r.s&&r.s[bi+"."+ei+"."+si];if(!v||!v.d||!(+v.w>0))return;if(+v.w>top){top=+v.w;topRow=si}
    for(let x=w-1;x>=0;x--){const q=peek(p,x,d),pv=q&&q.s&&q.s[bi+"."+ei+"."+si];if(pv&&+pv.w>0){if(+v.w-+pv.w>diff)diff=+v.w-+pv.w;break}}});
  const before=W.wt&&top?bestBefore(e,p,w,d):0;
  return{done:exGot(r,W,bi+"."+ei)>=need(W),top,topRow,diff,tier:diff>=15?3:diff>=10?2:diff>=5?1:0,pr:before>0&&top>before,before}}

function sessionStats(p,w,d){const r=peek(p,w,d)||{s:{}};let sets=0,lb=0,prs=0;const tiers=[0,0,0,0];let jump=null;
  PH[p].prog[d].forEach((b,bi)=>b.ex.forEach((e,ei)=>{const W=Wk(e,w);if(!W)return;rows(W).forEach((R,si)=>{const v=r.s&&r.s[bi+"."+ei+"."+si];if(!v||!v.d)return;sets++;
    if(+v.w>0){const n=parseInt(v.r)||String(R.t).replace(/^x/,"").split(/[-,+ ]/).map(x=>parseInt(x)).filter(x=>x>0).slice(0,/,/.test(R.t)?9:1).reduce((a,x)=>a+x,0)||1;lb+=+v.w*(/sec/.test(R.t)?1:n)}});
    const st=exState(bi,ei,p,w,d);if(st.pr)prs++;if(st.tier)tiers[st.tier]++;if(st.diff>0&&(!jump||st.diff>jump.diff))jump={name:e.name,diff:st.diff}}));
  return{sets,lb,prs,tiers,jump}}
function weekRecap(p,w){const Q=PH[p];let done=0,tot=0,sets=0,lb=0,prs=0,jump=null;const tiers=[0,0,0,0];
  Q.days.forEach(D=>{const x=dayPct(p,w,D.k);if(x==null)return;tot++;if(x>=.999)done++;const S=sessionStats(p,w,D.k);sets+=S.sets;lb+=S.lb;prs+=S.prs;S.tiers.forEach((n,i)=>tiers[i]+=n);if(S.jump&&(!jump||S.jump.diff>jump.diff))jump=S.jump});
  return{n:Q.weeks[w].n,range:weekRange(p,w),done,tot,sets,lb,prs,tiers,jump}}

/* ---- personal record wall ---- */
function records(){const out=[];Object.keys(NAMEIDX).forEach(key=>{const L=NAMEIDX[key],hits=[];
  L.forEach(x=>PH[x.p].weeks.forEach((_,w)=>{const t=topSet(x.p,w,x.d,x.bi,x.ei);if(t)hits.push({o:ord(x.p,w,x.di),t,p:x.p,w,d:x.d,bi:x.bi,ei:x.ei})}));
  if(!hits.length)return;hits.sort((a,b)=>a.o-b.o);let best=hits[0],raised=0;hits.forEach((h,i)=>{if(i&&h.t>best.t){best=h;raised++}});
  const r=peek(best.p,best.w,best.d);let when="";Object.keys(r.s||{}).forEach(k=>{if(k.startsWith(best.bi+"."+best.ei+".")&&+r.s[k].w===best.t&&r.s[k].t)when=r.s[k].t});
  const dt=when?pd(when):dayDate(best.p,best.w,best.d)||pd(PH[best.p].weeks[best.w].mon);
  out.push({name:L[0].name,w:best.t,first:hits[0].t,raised,dt,ph:PH[best.p].n,wk:PH[best.p].weeks[best.w].n,o:best.o})});
  return out.sort((a,b)=>b.o-a.o)}

     :`<section class="card"><div class="nc"><p>No weights logged yet. Your best set on every lift will show up here, with the date you hit it.</p></div></section>`}

/* ======================= HOW-TO GUIDE ======================= */
function guideHTML(){const S=(id,l,t,body)=>`<section class="card" id="g-${id}"><div class="chead"><div class="letter" style="font-size:13px">${l}</div><div class="t">${t}</div></div><div class="gsec">${body}</div></section>`;
  const row=(i,t)=>`<div class="grow"><div class="gi">${i}</div><div>${t}</div></div>`;
  const toc=[["start","Getting around"],["lineup","The lineup"],["log","Logging a set"],["timers","Timers"],["rewards","Badges & rewards"],["track","Tracking progress"],["settings","Settings & saving"]];
  return `<div class="gtoc">${toc.map(([k,l])=>`<button data-jump="g-${k}">${l}</button>`).join("")}</div>
   ${S("start","1","Getting around",`<ul>
     <li>The app <b>opens on today's lift</b>. The big button says <b>Start lift</b>, or <b>Keep going</b> if you've already started.</li>
     <li>Under the header are the <b>weeks</b> of the phase and the <b>days</b> of that week. Tap one to look at it. <b>Back to today's lift</b> brings you home.</li>
     <li>The bar at the bottom has four spots: <b>Today</b>, <b>Season</b> (a monthly calendar of every lift), <b>Trophies</b> (what you've earned) and <b>More</b> (progress, nutrition, coach's notes, settings).</li>
     <li>Fall phases lift <b>Mon / Wed / Thu</b>. Winter break, pre-season and in-season show <b>Day 1 / Day 2 / Day 3</b>: you choose the days, in order.</li></ul>`)}
   ${S("lineup","2","The lineup",`<ul>
     <li>Every workout is a short route of <b>stops</b>: warm-up, then blocks A, B, C, D, then the finish line.</li>
     <li>The red stop is <b>where you are</b>. Finished stops turn turquoise with a check. You can tap any stop to open it, in any order.</li>
     <li><b>Soft tissue</b> sits at the top for the six rolling videos. It's on your own and isn't counted.</li>
     <li><b>Warm-up:</b> tap each drill as you finish it, or hit <b>Check all</b> when you've done the whole list. The red play button shows the coach's demo.</li></ul>`)}
   ${S("log","3","Logging a set",`<ol>
     <li>Inside a block you see <b>one set at a time</b>. The navy card at the top shows how the block runs. In a <b>superset</b> it draws the loop: B1, then B2, then rest, then back to B1, and tells you which round you're on. The numbered buttons are that exercise's sets: <b>W</b> is a warm-up, red is the set you're on, turquoise is done. Tap any of them to jump to it.</li>
     <li>The left box says <b>what to do</b> (reps, or how long to hold). The right box is the <b>weight</b>, filled in for you at last week plus 5. Tap <b>−5</b> or <b>+5</b>, or tap the number and type your own.</li>
     <li>If the target is a range or a rep max, a <b>reps</b> box appears. Put in what you actually got.</li>
     <li>Hit <b>Done</b>. The app moves you to the next set. In a superset it sends you to the other exercise, the way the block is meant to be run.</li>
     <li>The <b>B1 / B2</b> buttons switch between exercises in the block yourself.</li>
     <li><b>Hurt?</b> Tap <b>Injured? Skip</b> under the Done button to skip one exercise, or <b>Injured? Skip this whole lift</b> at the bottom of the lineup. It marks it off without logging sets, your coach can see it, and you can undo it.</li>
     <li><b>Coach's demo</b> at the top plays the video right there. The chat bubble is the coach's note for this week.</li>
     <li>Open <b>More from the coach</b> for every cue, the "you pick" options, what the abbreviations mean, the rest times, and a box for your own note.</li>
     <li>Logged the wrong thing? Tap that set's number, then <b>Undo</b>, or just change the weight.</li></ol>`)}
   ${S("timers","4","Timers",`<ul>
     <li><b>Timed sets</b> (planks, holds, stretches) have a <b>Start timer</b> button. "Both sides" runs one side, gives you 5 seconds to switch, then runs the other. The set logs itself when it ends.</li>
     <li><b>Auto rest:</b> when you finish a round, the block's rest clock starts on its own. Tap <b>Turn off for future use</b> on the timer if you don't want it.</li>
     <li>The <b>circle in the top right</b> of a lift starts the rest clock by hand.</li>
     <li><b>Timed circuits</b> have a clock button and a box for the rounds you got.</li>
     <li>The only sound in the app is the beep when a timer ends. <b>Mute</b> in Settings turns that off too.</li></ul>`)}
   ${S("rewards","5","Badges & rewards",
     row(`<span style="font-size:26px">🔥</span>`,`<b>Every set:</b> a small emoji pops when you hit Done. A different one each time.`)+
     row(shieldHTML(1,5)+shieldHTML(2,10)+shieldHTML(3,15),`<b>Shields:</b> beat the same set from last week by <b>5 lb</b> (bronze), <b>10 lb</b> (silver) or <b>15 lb</b> (gold). The shield sits next to the exercise name.`)+
     row(prEmb(),`<b>PR:</b> the heaviest set you've <b>ever</b> logged on that lift, any set, any week. Beating last week on one set isn't a PR. Your first time on a lift sets your starting mark.`)+
     row(`<span class="ministamp">DONE</span>`,`<b>Done stamp:</b> slams down when you finish every set of an exercise.`)+
     row(`<span style="font-size:26px">🎉</span>`,`<b>Workout complete:</b> finish every stop for confetti and your numbers: sets, pounds moved, PRs and shields.`)+
     row(`<span style="font-size:26px">📊</span>`,`<b>Week recap:</b> finish the last lift of the week and you get the week's totals and your biggest jump.`)+
     row(`<span style="font-size:26px">🏆</span>`,`<b>Phase trophy:</b> finish every lift in a phase to light up its trophy. There are 10.`))}
   ${S("track","6","Tracking progress",`<ul>
     <li><b>Trophies:</b> your phase trophies, every shield you've earned, and your <b>PR list</b> with dates.</li>
     <li><b>More › Progress:</b> a line plot of the pounds you moved each week, and one of your top set on every weighted lift in the phase.</li>
     <li><b>Season:</b> a monthly calendar. Red days are lifts and turquoise days are done. Tap a day to open that lift. In phases where you pick your own days, the week shows Day 1 / Day 2 / Day 3 buttons instead.</li>
     <li><b>More › Nutrition:</b> daily carbs, fat and protein (calories fill in for you) and a weigh-in every fifth day.</li>
     <li><b>More › Coach's notes:</b> the training reference: RPE scale, tempo, rep max, how to read the card, and the in-season rules.</li></ul>`)}
   ${S("settings","7","Settings & saving",`<ul>
     <li><b>More › Settings:</b> dark mode, auto rest timer, mute, and reduce effects (no floating emoji or confetti; badges still show).</li>
     <li><b>More › Abbreviation key:</b> every abbreviation and the RPE scale.</li>
     <li><b>Coaches</b> get a <b>Coach's view</b> under More: everyone's week at a glance and the list of who has signed up.</li>
     <li><b>Quote of the week</b> sits at the top of Today. Coaches can hit <b>Shuffle quote</b> in Coach's view to swap it for the whole team. The <b>Quotes</b> tab there lists all 50 with their sources; tap <b>Out</b> to pull any you don't want.</li>
     <li><b>Saving is automatic.</b> There's no save button. Close the app whenever; your numbers are there when you come back.</li></ul>`)}
   <div class="foot">Questions about the training itself? Check Coach's notes or ask your coach.</div>`}

const DEMO_RECAP={n:11,range:"11/16 – 11/22",done:3,tot:3,sets:98,lb:41250,prs:2,tiers:[0,3,2,1],jump:{name:"Trap Bar Deadlift - Clusters",diff:20}};

  if(/^t[123]$/.test(t)||t==="pr"||t==="done"||t==="clear"){const was=Object.assign({},TM);
